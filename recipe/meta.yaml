{% set name = "jupyterlab-git" %}
{% set version = "0.53.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/j/jupyterlab-git-core/jupyterlab_git_core-{{ version }}.tar.gz
    sha256: a4c4c104eb8f7e62fdc05449834e0b56f3d6b6df30c769ceae52e4001fcbf9e1
    folder: core
  - url: https://pypi.org/packages/source/j/jupyterlab-git/jupyterlab_git-{{ version }}.tar.gz
    sha256: 121f0e0bbf637feaed5893d68ca741fd99ae6f7735ab7ef5db230d6da5d19d98
    folder: jupyterlab

build:
  number: 0

outputs:
  - name: jupyterlab-git-core
    build:
      noarch: python
      script: cd core && $PYTHON -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - hatch-jupyter-builder >=0.5
        - hatch-nodejs-version >=0.3.2
        - hatchling >=1.5.0
        - jupyterlab =4
        - pip
        - python {{ python_min }}
      run:
        - anyio
        - nbdime >=4.0,<5.0
        - nbformat
        - packaging
        - pexpect
        - python >={{ python_min }},<4.0
        - traitlets >=5.0,<6.0
      run_constrained:
        - jupyterlab >=4,<5
    test:
      requires:
        - jupyterlab
        - pip
        - python {{ python_min }}
      imports:
        - jupyterlab_git_core
      commands:
        - pip check
        - jupyter labextension list
        - jupyter labextension list 2>&1 | grep -ie "@jupyterlab/git.*OK.*(python, jupyterlab-git-core)"
    about:
      license_file: core/LICENSE

  - name: jupyterlab-git
    build:
      noarch: python
      script: cd jupyterlab && $PYTHON -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - hatch-nodejs-version >=0.3.2
        - hatchling >=1.5.0
        - pip
        - python {{ python_min }}
      run:
        - {{ pin_subpackage('jupyterlab-git-core', exact=True) }}
        - jupyter_server >=2.0.1,<3.0
        - python >={{ python_min }},<4.0
        - traitlets >=5.0,<6.0
      run_constrained:
        - jupyterlab >=4,<5
    test:
      requires:
        - jupyterlab
        - pip
        - python {{ python_min }}
      imports:
        - jupyterlab_git
      commands:
        - pip check
        - jupyter server extension list
        - jupyter server extension list 2>&1 | grep -ie "jupyterlab_git.*OK"
        - jupyter labextension list
        - jupyter labextension list 2>&1 | grep -ie "@jupyterlab/git.*OK"
    about:
      license_file: jupyterlab/LICENSE

about:
  home: https://github.com/jupyterlab/jupyterlab-git
  license: BSD-3-Clause
  license_family: BSD
  license_file: core/LICENSE
  summary: A Git extension for JupyterLab
  description: A JupyterLab extension for version control using git
  dev_url: https://github.com/jupyterlab/jupyterlab-git

extra:
  recipe-maintainers:
    - jtpio
    - krassowski
    - dlqqq
    - dbast
    - blink1073
    - fcollonval
