# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.55.0"
  python_check_max: "3.14"
  grep: ${{ "grep -iE" if unix else "findstr /c" }}

recipe:
  name: jupyterlab-git-split
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/j/jupyterlab-git-core/jupyterlab_git_core-${{ version }}.tar.gz
    sha256: 7a9b00e6fc901c2b39b710e3cf45251d6b855565a45cbd06ff09e3401836f251
    target_directory: core
  - url: https://pypi.org/packages/source/j/jupyterlab-git/jupyterlab_git-${{ version }}.tar.gz
    sha256: b631ee1476aa9d9c7dc1bc3909593dfbc788ca1fd04e079d21d7688ecfc1d0d7
    target_directory: jupyterlab

build:
  number: 0

outputs:
  - package:
      name: jupyterlab-git-core
    build:
      noarch: python
      script:
        - cd core
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - hatch-jupyter-builder >=0.5
        - hatch-nodejs-version >=0.3.2
        - hatchling >=1.5.0
        - jupyterlab >=4,<5
        - pip
        - python ${{ python_min }}.*
      run:
        - anyio
        - nbformat
        - packaging
        - pexpect
        - python >=${{ python_min }}
        - traitlets >=5.0,<6.0
        # [nbdime]
        - nbdime >=4.0.1,<4.1
      run_constraints:
        - jupyterlab >=4,<5
        # avoid installing clobbering jupyterlab-git<0.53
        - jupyterlab-git ${{ version }}.*
    tests:
      - python:
          imports: jupyterlab_git_core
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - requirements:
          run:
            - jupyterlab
            - python ${{ python_min }}.*
        script:
          - jupyter labextension list
          - jupyter labextension list 2>&1 | ${{ grep }} "@jupyterlab/git.*OK.*(python, jupyterlab-git-core)"
          - jupyter labextension list 2>&1 | ${{ grep }} "nbdime-jupyterlab.*OK"
    about:
      description: Core Git operations library for the jupyterlab-git JupyterLab extension.
      homepage: https://pypi.org/project/jupyterlab-git-core
      license_file:
        - core/LICENSE
        - core/jupyterlab_git_core/labextension/static/third-party-licenses.json

  - package:
      name: jupyterlab-git
    build:
      noarch: python
      script:
        - cd jupyterlab
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - hatch-nodejs-version >=0.3.2
        - hatchling >=1.5.0
        - pip
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage("jupyterlab-git-core", exact=True) }}
        - jupyter_server >=2.0.1,<3.0
        - nbdime
        - python >=${{ python_min }}
        - traitlets >=5.0,<6.0
      run_constraints:
        - jupyterlab >=4,<5
    tests:
      - python:
          imports: jupyterlab_git
          pip_check: true
          python_version: ${{ python_min }}
      - requirements:
          run:
            - jupyterlab
            - python ${{ python_min }}.*
        script:
          - jupyter server extension list
          - jupyter server extension list 2>&1 | ${{ grep }} "jupyterlab_git.*OK"
          - jupyter labextension list
          - jupyter labextension list 2>&1 | ${{ grep }} "@jupyterlab/git.*OK"
    about:
      homepage: https://pypi.org/project/jupyterlab-git
      license_file: jupyterlab/LICENSE

about:
  license: BSD-3-Clause
  license_file: core/LICENSE
  summary: A Git extension for JupyterLab
  description: A JupyterLab extension for version control using git
  homepage: https://github.com/jupyterlab/jupyterlab-git
  repository: https://github.com/jupyterlab/jupyterlab-git

extra:
  feedstock-name: jupyterlab-git
  recipe-maintainers:
    - jtpio
    - krassowski
    - dlqqq
    - dbast
    - blink1073
    - fcollonval
    - bollwyvl
